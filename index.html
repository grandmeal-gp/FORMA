<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Экспресс-отчёт Директора вагона-ресторана</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
        }

        body {
            background: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
        }

        .dashboard {
            max-width: 1400px;
            width: 100%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #0f172a;
            color: white;
            padding: 16px 20px;
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header span {
            background: #3b82f6;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: normal;
        }

        .two-columns {
            display: flex;
            flex-wrap: wrap;
        }

        .form-section {
            flex: 1.2;
            padding: 20px;
            background: #f8fafc;
            border-right: none;
            border-bottom: 1px solid #e2e8f0;
        }

        .chat-section {
            flex: 1.8;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 450px;
            max-height: 550px;
            background: #fefefe;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 95%;
            animation: fadeSlide 0.2s ease;
        }

        .message.system {
            align-items: flex-start;
        }

        .message.user {
            align-items: flex-end;
        }

        .bubble {
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: 0 1px 1px rgba(0,0,0,0.05);
        }

        .system .bubble {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            color: #0f172a;
            border-bottom-left-radius: 4px;
        }

        .system .bubble.instruction {
            padding: 10px 14px;
        }

        .instruction-line {
            display: block;
            margin-bottom: 6px;
            white-space: normal;
            word-break: break-word;
        }

        .user .bubble {
            background: #3b82f6;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .time {
            font-size: 0.65rem;
            color: #64748b;
            margin-top: 4px;
            margin-inline: 6px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            color: #0f172a;
            font-size: 0.8rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            font-size: 0.9rem;
            transition: 0.2s;
            background: white;
            -webkit-appearance: none;
            appearance: none;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }

        .row-2 {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .row-2 .form-group {
            flex: 1;
            min-width: 120px;
        }

        .row-3 {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .row-3 .form-group {
            flex: 1;
            min-width: 90px;
        }

        button {
            background: #0f172a;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            width: 100%;
            margin-top: 8px;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            background: #1e293b;
            transform: scale(0.98);
        }

        .clear-chat {
            background: #e2e8f0;
            color: #1e293b;
            margin-top: 10px;
        }

        .clear-chat:hover {
            background: #cbd5e1;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Адаптация для мобильных устройств */
        @media (min-width: 768px) {
            .form-section {
                border-right: 1px solid #e2e8f0;
                border-bottom: none;
                padding: 28px;
            }
            .chat-messages {
                min-height: 650px;
                max-height: 750px;
            }
            .header {
                padding: 20px 28px;
                font-size: 1.5rem;
            }
            .bubble {
                font-size: 0.95rem;
                padding: 12px 18px;
            }
            .instruction-line {
                white-space: nowrap;
            }
        }

        @media (max-width: 767px) {
            .row-2 {
                flex-direction: column;
                gap: 12px;
            }
            .row-3 {
                flex-direction: column;
                gap: 12px;
            }
            .row-2 .form-group {
                min-width: auto;
            }
            .row-3 .form-group {
                min-width: auto;
            }
            button {
                padding: 14px 20px;
                font-size: 1rem;
            }
            .chat-messages {
                min-height: 400px;
                max-height: 450px;
            }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="header">
        🍽️ Экспресс-отчёт Директора вагона-ресторана
        <span>Чат-интеграция</span>
    </div>
    <div class="two-columns">
        <!-- ФОРМА ЗАПОЛНЕНИЯ -->
        <div class="form-section">
            <h3 style="margin-top:0; font-size: 1.2rem;">📋 Данные по рейсу</h3>

            <div class="row-2">
                <div class="form-group">
                    <label>🚂 Номер поезда</label>
                    <select id="trainNumber">
                        <option value="27/28">27/28</option>
                        <option value="67/68">67/68</option>
                        <option value="17/18">17/18</option>
                        <option value="91/92">91/92</option>
                        <option value="195/196">195/196</option>
                        <option value="97/98">97/98</option>
                        <option value="53/54">53/54</option>
                        <option value="141/142">141/142</option>
                        <option value="75/76">75/76</option>
                        <option value="315/316">315/316</option>
                        <option value="7/8">7/8</option>
                        <option value="179/180">179/180</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>🚃 Состав (номер)</label>
                    <select id="trainComposition">
                        <option value="1">1 состав</option>
                        <option value="2" selected>2 состав</option>
                        <option value="3">3 состав</option>
                        <option value="4">4 состав</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>🗺️ Маршрут</label>
                <select id="routeSelect">
                    <option value="Симферополь-Москва">Симферополь-Москва</option>
                    <option value="Москва-Симферополь">Москва-Симферополь</option>
                    <option value="Севастополь-Москва">Севастополь-Москва</option>
                    <option value="Москва-Севастополь">Москва-Севастополь</option>
                    <option value="Санкт-Петербург-Севастополь">Санкт-Петербург-Севастополь</option>
                    <option value="Севастополь-Санкт-Петербург">Севастополь-Санкт-Петербург</option>
                    <option value="Симферополь-Пермь">Симферополь-Пермь</option>
                    <option value="Пермь-Симферополь">Пермь-Симферополь</option>
                    <option value="Симферополь-Адлер">Симферополь-Адлер</option>
                    <option value="Адлер-Симферополь">Адлер-Симферополь</option>
                    <option value="Омск-Симферополь">Омск-Симферополь</option>
                    <option value="Симферополь-Омск">Симферополь-Омск</option>
                    <option value="Санкт-Петербург-Москва">Санкт-Петербург-Москва</option>
                    <option value="Москва-Санкт-Петербург">Москва-Санкт-Петербург</option>
                    <option value="Санкт-Петербург-Евпатория">Санкт-Петербург-Евпатория</option>
                    <option value="Евпатория-Санкт-Петербург">Евпатория-Санкт-Петербург</option>
                </select>
            </div>

            <div class="form-group">
                <label>🚃 Номер вагона-ресторана</label>
                <input type="text" id="wagonNumber" placeholder="например: 07" value="07">
            </div>

            <div class="form-group">
                <label>📅 Дата прибытия</label>
                <input type="date" id="arrivalDate" value="2025-03-20">
            </div>

            <div class="row-2">
                <div class="form-group">
                    <label>💰 Выручка (₽)</label>
                    <input type="number" id="revenue" value="157800">
                </div>
                <div class="form-group">
                    <label>🧾 Количество чеков</label>
                    <input type="number" id="checkCount" value="34">
                </div>
            </div>

            <div class="row-2">
                <div class="form-group">
                    <label>👥 ГП</label>
                    <input type="number" id="gp" value="42">
                </div>
                <div class="form-group">
                    <label>👥 СВ</label>
                    <input type="number" id="sv" value="18">
                </div>
            </div>

            <div class="row-3">
                <div class="form-group">
                    <label>🍳 ЛЮКС (завтрак)</label>
                    <input type="number" id="luxBreakfast" value="4">
                </div>
                <div class="form-group">
                    <label>🍽️ ЛЮКС (обед)</label>
                    <input type="number" id="luxLunch" value="5">
                </div>
                <div class="form-group">
                    <label>🍷 ЛЮКС (ужин)</label>
                    <input type="number" id="luxDinner" value="3">
                </div>
            </div>

            <div class="row-2">
                <div class="form-group">
                    <label>👶 ОГД (кол-во детей)</label>
                    <input type="number" id="ogdKidsCount" value="7">
                </div>
                <div class="form-group">
                    <label>🧸 ОГД (выручка, ₽)</label>
                    <input type="number" id="ogdRevenue" value="12400">
                </div>
            </div>

            <div class="form-group">
                <label>📝 ГП замечания</label>
                <textarea id="gpRemarks" rows="2">Чисто, нареканий нет</textarea>
            </div>

            <div class="form-group">
                <label>⚠️ Неисправности</label>
                <textarea id="malfunction" rows="2">Датчик двери в 5 вагоне</textarea>
            </div>

            <div class="form-group">
                <label>🚨 Происшествия</label>
                <textarea id="incidents" rows="2">За время рейса происшествий не зафиксировано</textarea>
            </div>

            <div class="form-group">
                <label>👤 ДВР (дежурный по вагону)</label>
                <input type="text" id="dvr" value="Иванов А.А.">
            </div>

            <button id="sendReportBtn">📤 Отправить отчёт в чат Express</button>
            <button id="clearChatBtn" class="clear-chat" style="margin-top: 12px;">🗑 Очистить историю чата</button>
        </div>

        <div class="chat-section">
            <div class="chat-messages" id="chatMessages"></div>
        </div>
    </div>
</div>

<script>
    const trainNumberSelect = document.getElementById('trainNumber');
    const trainCompositionSelect = document.getElementById('trainComposition');
    const routeSelect = document.getElementById('routeSelect');
    const wagonNumberInp = document.getElementById('wagonNumber');
    const arrivalDateInp = document.getElementById('arrivalDate');
    const revenueInp = document.getElementById('revenue');
    const checkCountInp = document.getElementById('checkCount');
    const gpInp = document.getElementById('gp');
    const svInp = document.getElementById('sv');
    const luxBreakfastInp = document.getElementById('luxBreakfast');
    const luxLunchInp = document.getElementById('luxLunch');
    const luxDinnerInp = document.getElementById('luxDinner');
    const ogdKidsCountInp = document.getElementById('ogdKidsCount');
    const ogdRevenueInp = document.getElementById('ogdRevenue');
    const gpRemarksInp = document.getElementById('gpRemarks');
    const malfunctionInp = document.getElementById('malfunction');
    const incidentsInp = document.getElementById('incidents');
    const dvrInp = document.getElementById('dvr');
    const chatContainer = document.getElementById('chatMessages');

    function addInstructionMessage() {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message system';
        
        const bubble = document.createElement('div');
        bubble.className = 'bubble instruction';
        
        const line1 = document.createElement('div');
        line1.className = 'instruction-line';
        line1.textContent = '1. Заполните форму и нажмите «Отправить отчёт».';
        
        const line2 = document.createElement('div');
        line2.className = 'instruction-line';
        line2.textContent = '2. Сообщение появится как новое сообщение.';
        
        const line3 = document.createElement('div');
        line3.className = 'instruction-line';
        line3.textContent = '3. Скопируйте сообщение и направьте в чат Exspress в группу ДВРы Гранд-Питание';
        
        bubble.appendChild(line1);
        bubble.appendChild(line2);
        bubble.appendChild(line3);
        
        const timeSpan = document.createElement('div');
        timeSpan.className = 'time';
        timeSpan.textContent = 'только что';
        
        messageDiv.appendChild(bubble);
        messageDiv.appendChild(timeSpan);
        chatContainer.appendChild(messageDiv);
    }

    function addMessageToChat(text, sender = 'system') {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender}`;
        
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        
        const timeSpan = document.createElement('div');
        timeSpan.className = 'time';
        const now = new Date();
        timeSpan.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' });
        
        messageDiv.appendChild(bubble);
        messageDiv.appendChild(timeSpan);
        chatContainer.appendChild(messageDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function generateReportText() {
        let trainNumber = trainNumberSelect.value;
        let composition = trainCompositionSelect.value;
        let route = routeSelect.value;
        let wagonNumber = wagonNumberInp.value.trim() || "не указан";
        let arrivalDate = arrivalDateInp.value || "дата не задана";
        let revenue = parseFloat(revenueInp.value) || 0;
        let checkCount = parseInt(checkCountInp.value) || 0;
        let gp = gpInp.value || "0";
        let sv = svInp.value || "0";
        let luxBreakfast = parseInt(luxBreakfastInp.value) || 0;
        let luxLunch = parseInt(luxLunchInp.value) || 0;
        let luxDinner = parseInt(luxDinnerInp.value) || 0;
        let ogdKids = parseInt(ogdKidsCountInp.value) || 0;
        let ogdRevenueVal = parseFloat(ogdRevenueInp.value) || 0;
        let gpRemarks = gpRemarksInp.value.trim() || "—";
        let malfunction = malfunctionInp.value.trim() || "—";
        let incidents = incidentsInp.value.trim() || "—";
        let dvr = dvrInp.value.trim() || "—";
        let avgCheck = (checkCount === 0) ? 0 : revenue / checkCount;

        return `📌 Поезд: ${trainNumber} (${composition} состав)
🗺️ Маршрут: ${route}
🚃 Вагон: ${wagonNumber}
📅 Дата прибытия: ${arrivalDate}

💰 Выручка: ${revenue.toLocaleString()} ₽
🧾 Чеков: ${checkCount.toLocaleString()} шт.
📊 Средний чек: ${Math.round(avgCheck).toLocaleString()} ₽

👥 Пассажиры: ГП ${gp} | СВ ${sv}

👑 ЛЮКС:
   🍳 завтрак: ${luxBreakfast}
   🍽️ обед: ${luxLunch}
   🍷 ужин: ${luxDinner}

👶 ОГД (дети):
   🧸 Количество детей: ${ogdKids}
   💰 Выручка: ${ogdRevenueVal.toLocaleString()} ₽

📝 ГП замечания:
${gpRemarks}

⚠️ Неисправности:
${malfunction}

🚨 Происшествия:
${incidents}

👤 ДВР: ${dvr}`;
    }

    function sendReportToChat() {
        const reportText = generateReportText();
        if (!reportText) return;
        addMessageToChat(reportText, 'user');
    }

    function clearChat() {
        while (chatContainer.firstChild) {
            chatContainer.removeChild(chatContainer.firstChild);
        }
        addInstructionMessage();
    }

    addInstructionMessage();

    document.getElementById('sendReportBtn').addEventListener('click', sendReportToChat);
    document.getElementById('clearChatBtn').addEventListener('click', clearChat);
</script>
</body>
</html>
