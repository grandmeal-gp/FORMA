<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Экспресс-отчёт Директора вагона-ресторана</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
        }

        body {
            background: #e2e8f0;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        .dashboard {
            width: 100%;
            height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #0f172a;
            color: white;
            padding: 10px 14px;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .header span {
            background: #3b82f6;
            padding: 3px 10px;
            border-radius: 100px;
            font-size: 0.65rem;
        }

        .two-columns {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            flex-direction: row;
        }

        .form-section {
            flex: 1;
            width: 50%;
            padding: 10px;
            background: #f8fafc;
            overflow-y: auto;
            border-right: 1px solid #e2e8f0;
        }

        .chat-section {
            flex: 1;
            width: 50%;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            min-height: 0;
        }

        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fefefe;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 100%;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 100%;
        }

        .message.system {
            align-items: flex-start;
        }

        .message.user {
            align-items: flex-end;
        }

        .bubble {
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
            max-width: 100%;
        }

        .system .bubble {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            color: #0f172a;
        }

        .user .bubble {
            background: #3b82f6;
            color: white;
        }

        .time {
            font-size: 0.55rem;
            color: #64748b;
            margin-top: 3px;
            margin-inline: 5px;
        }

        .copy-btn {
            background: #e2e8f0;
            border: none;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 0.65rem;
            cursor: pointer;
            margin-top: 4px;
            align-self: flex-end;
            color: #1e293b;
            transition: 0.15s;
        }

        .copy-btn:hover {
            background: #cbd5e1;
        }

        .copy-btn.copied {
            background: #22c55e;
            color: white;
        }

        .form-group {
            margin-bottom: 8px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 3px;
            font-size: 0.7rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.75rem;
            background: white;
        }

        textarea {
            resize: vertical;
            min-height: 40px;
        }

        .row-2, .row-3 {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .row-2 .form-group, .row-3 .form-group {
            flex: 1;
            min-width: 70px;
        }

        button {
            background: #0f172a;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            width: 100%;
            margin-top: 6px;
            cursor: pointer;
        }

        .clear-chat {
            background: #e2e8f0;
            color: #1e293b;
            margin-top: 6px;
        }

        .info-hint {
            font-size: 0.65rem;
            color: #64748b;
            margin-top: 2px;
        }

        @media (min-width: 768px) {
            .header {
                padding: 16px 24px;
                font-size: 1.3rem;
            }
            .form-section {
                padding: 20px;
            }
            .bubble {
                font-size: 0.9rem;
                padding: 10px 14px;
            }
            label {
                font-size: 0.8rem;
            }
            input, select, textarea {
                padding: 8px 10px;
                font-size: 0.85rem;
            }
            button {
                padding: 10px 16px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 600px) {
            .header {
                padding: 8px 12px;
                font-size: 0.9rem;
            }
            .form-section, .chat-section {
                padding: 6px;
            }
            .bubble {
                font-size: 0.7rem;
                padding: 5px 8px;
            }
            label {
                font-size: 0.65rem;
            }
            input, select, textarea {
                padding: 4px 6px;
                font-size: 0.7rem;
            }
            button {
                padding: 6px 10px;
                font-size: 0.75rem;
            }
            .row-2, .row-3 {
                gap: 4px;
            }
            .copy-btn {
                padding: 3px 8px;
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="header">
        🍽️ Экспресс-отчёт Директора вагона-ресторана
        <span>Чат</span>
    </div>
    <div class="two-columns">
        <div class="form-section">
            <h3 style="margin:0 0 6px 0;">📋 Данные</h3>
            <div class="row-2">
                <div class="form-group"><label>🚂 Поезд</label><select id="trainNumber"><option value="">-- выберите --</option><option>27/28</option><option>67/68</option><option>17/18</option><option>91/92</option><option>195/196</option><option>97/98</option><option>53/54</option><option>141/142</option><option>75/76</option><option>315/316</option><option>7/8</option><option>179/180</option></select></div>
                <div class="form-group"><label>🚃 Состав</label><select id="trainComposition"><option value="">-- выберите --</option><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
            </div>
            <div class="form-group"><label>🗺️ Маршрут</label><select id="routeSelect"><option value="">-- выберите --</option><option>Симферополь-Москва</option><option>Москва-Симферополь</option><option>Севастополь-Москва</option><option>Москва-Севастополь</option><option>Санкт-Петербург-Севастополь</option><option>Севастополь-Санкт-Петербург</option><option>Симферополь-Пермь</option><option>Пермь-Симферополь</option><option>Симферополь-Адлер</option><option>Адлер-Симферополь</option><option>Омск-Симферополь</option><option>Симферополь-Омск</option><option>Санкт-Петербург-Москва</option><option>Москва-Санкт-Петербург</option><option>Санкт-Петербург-Евпатория</option><option>Евпатория-Санкт-Петербург</option></select></div>
            <div class="form-group"><label>🚃 №ВР</label><input type="text" id="wagonNumber" placeholder="Номер вагона-ресторана" value=""></div>
            <div class="form-group"><label>📅 Дата прибытия</label><input type="date" id="arrivalDate" value=""></div>
            <div class="row-2"><div class="form-group"><label>💰 Выручка</label><input type="number" id="revenue" placeholder="0" value=""></div><div class="form-group"><label>🧾 Чеков</label><input type="number" id="checkCount" placeholder="0" value=""></div></div>
            <div class="row-2">
                <div class="form-group"><label>👥 ГП (Купе)</label><input type="number" id="gpCoupe" placeholder="0" value=""></div>
                <div class="form-group"><label>👥 СВ</label><input type="number" id="gpSv" placeholder="0" value=""></div>
            </div>
            
            <!-- Каши комплементарные (только для поезда 27/28) -->
            <div class="form-group" id="porridgeGroup" style="display: none;">
                <label>🥣 Каши комплементарные</label>
                <input type="text" id="porridge" placeholder="например: 1,2,3 или 4,5,6" value="">
                <div class="info-hint">Заполняется только для поезда 27/28</div>
            </div>
            
            <div class="row-3"><div class="form-group"><label>🍳 ЛЮКС завтрак</label><input type="number" id="luxBreakfast" placeholder="0" value=""></div><div class="form-group"><label>🍽️ обед</label><input type="number" id="luxLunch" placeholder="0" value=""></div><div class="form-group"><label>🍷 ужин</label><input type="number" id="luxDinner" placeholder="0" value=""></div></div>
            
            <div class="row-2">
                <div class="form-group"><label>👶 ОГД (дети)</label><input type="text" id="ogdKids" placeholder="например: 1,2,3 или 4,5,6" value=""></div>
                <div class="form-group"><label>💰 ОГД выручка (₽)</label><input type="number" id="ogdRevenue" placeholder="0" value=""></div>
            </div>
            
            <div class="form-group"><label>📝 ГП замечания</label><textarea id="gpRemarks" rows="1" placeholder="Замечания"></textarea></div>
            <div class="form-group"><label>⚠️ Неисправности</label><textarea id="malfunction" rows="1" placeholder="Неисправности"></textarea></div>
            <div class="form-group"><label>🚨 Происшествия</label><textarea id="incidents" rows="1" placeholder="Происшествия"></textarea></div>
            <div class="form-group"><label>👤 ДВР</label><input type="text" id="dvr" placeholder="ФИО" value=""></div>
            <button id="sendReportBtn">📤 Отправить</button>
            <button id="clearChatBtn" class="clear-chat">🗑 Очистить чат</button>
        </div>
        <div class="chat-section">
            <div class="chat-messages" id="chatMessages"></div>
        </div>
    </div>
</div>

<script>
    const trainNumberSelect = document.getElementById('trainNumber');
    const trainCompositionSelect = document.getElementById('trainComposition');
    const routeSelect = document.getElementById('routeSelect');
    const wagonNumberInp = document.getElementById('wagonNumber');
    const arrivalDateInp = document.getElementById('arrivalDate');
    const revenueInp = document.getElementById('revenue');
    const checkCountInp = document.getElementById('checkCount');
    const gpCoupeInp = document.getElementById('gpCoupe');
    const gpSvInp = document.getElementById('gpSv');
    const porridgeInp = document.getElementById('porridge');
    const porridgeGroup = document.getElementById('porridgeGroup');
    const luxBreakfastInp = document.getElementById('luxBreakfast');
    const luxLunchInp = document.getElementById('luxLunch');
    const luxDinnerInp = document.getElementById('luxDinner');
    const ogdKidsInp = document.getElementById('ogdKids');
    const ogdRevenueInp = document.getElementById('ogdRevenue');
    const gpRemarksInp = document.getElementById('gpRemarks');
    const malfunctionInp = document.getElementById('malfunction');
    const incidentsInp = document.getElementById('incidents');
    const dvrInp = document.getElementById('dvr');
    const chatContainer = document.getElementById('chatMessages');

    // Показываем/скрываем поле "Каши комплементарные" в зависимости от выбранного поезда
    trainNumberSelect.addEventListener('change', function() {
        if (this.value === '27/28') {
            porridgeGroup.style.display = 'block';
        } else {
            porridgeGroup.style.display = 'none';
            porridgeInp.value = '';
        }
    });

    function addInstructionMessage() {
        const wrapper = document.createElement('div');
        wrapper.className = 'message-wrapper';
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message system';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = '1. Заполните форму и нажмите «Отправить».<br>2. Сообщение появится в чате.<br>3. Скопируйте сообщение (кнопка под ним) и направьте в чат Exspress в группу ДВРы Гранд-Питание';
        const timeSpan = document.createElement('div');
        timeSpan.className = 'time';
        timeSpan.textContent = 'только что';
        messageDiv.appendChild(bubble);
        messageDiv.appendChild(timeSpan);
        wrapper.appendChild(messageDiv);
        chatContainer.appendChild(wrapper);
    }

    function addUserMessageWithCopy(text) {
        const wrapper = document.createElement('div');
        wrapper.className = 'message-wrapper';
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message user';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        const timeSpan = document.createElement('div');
        timeSpan.className = 'time';
        const now = new Date();
        timeSpan.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' });
        messageDiv.appendChild(bubble);
        messageDiv.appendChild(timeSpan);
        const copyBtn = document.createElement('button');
        copyBtn.textContent = '📋 Копировать';
        copyBtn.className = 'copy-btn';
        copyBtn.onclick = () => {
            navigator.clipboard.writeText(text).then(() => {
                copyBtn.textContent = '✅ Скопировано!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = '📋 Копировать';
                    copyBtn.classList.remove('copied');
                }, 2000);
            });
        };
        wrapper.appendChild(messageDiv);
        wrapper.appendChild(copyBtn);
        chatContainer.appendChild(wrapper);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function generateReportText() {
        let trainNumber = trainNumberSelect.value;
        let composition = trainCompositionSelect.value;
        let route = routeSelect.value;
        let wagonNumber = wagonNumberInp.value.trim() || "—";
        let arrivalDate = arrivalDateInp.value || "—";
        let revenue = parseFloat(revenueInp.value) || 0;
        let checkCount = parseInt(checkCountInp.value) || 0;
        let gpCoupe = gpCoupeInp.value || "0";
        let gpSv = gpSvInp.value || "0";
        let porridge = porridgeInp.value.trim();
        let luxBreakfast = parseInt(luxBreakfastInp.value) || 0;
        let luxLunch = parseInt(luxLunchInp.value) || 0;
        let luxDinner = parseInt(luxDinnerInp.value) || 0;
        let ogdKids = ogdKidsInp.value.trim() || "—";
        let ogdRevenueVal = parseFloat(ogdRevenueInp.value) || 0;
        let gpRemarks = gpRemarksInp.value.trim() || "—";
        let malfunction = malfunctionInp.value.trim() || "—";
        let incidents = incidentsInp.value.trim() || "—";
        let dvr = dvrInp.value.trim() || "—";

        if (!trainNumber) trainNumber = "—";
        if (!composition) composition = "—";
        if (!route) route = "—";

        let result = `📌 Поезд: ${trainNumber} (${composition} состав)
🗺️ Маршрут: ${route}
🚃 №ВР: ${wagonNumber}
📅 Дата прибытия: ${arrivalDate}
💰 Выручка: ${revenue.toLocaleString()} ₽
🧾 Чеков: ${checkCount.toLocaleString()} шт.
👥 ГП: Купе ${gpCoupe} | СВ ${gpSv}`;

        // Добавляем строку с кашами только если выбран поезд 27/28 и поле заполнено
        if (trainNumber === '27/28' && porridge) {
            result += `\n🥣 Каши комплементарные: ${porridge}`;
        }

        result += `\n👑 ЛЮКС:
   🍳 завтрак: ${luxBreakfast}
   🍽️ обед: ${luxLunch}
   🍷 ужин: ${luxDinner}
👶 ОГД: детей ${ogdKids} | выручка ${ogdRevenueVal.toLocaleString()} ₽
📝 ГП замечания:
${gpRemarks}
⚠️ Неисправности:
${malfunction}
🚨 Происшествия:
${incidents}
👤 ДВР: ${dvr}`;

        return result;
    }

    function sendReportToChat() {
        const reportText = generateReportText();
        if (!reportText) return;
        addUserMessageWithCopy(reportText);
    }

    function clearChat() {
        while (chatContainer.firstChild) {
            chatContainer.removeChild(chatContainer.firstChild);
        }
        addInstructionMessage();
    }

    addInstructionMessage();

    document.getElementById('sendReportBtn').addEventListener('click', sendReportToChat);
    document.getElementById('clearChatBtn').addEventListener('click', clearChat);
</script>
</body>
</html>
