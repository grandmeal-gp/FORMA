<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Экспресс-отчёт Директора вагона-ресторана</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
        }

        body {
            background: #e2e8f0;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        .dashboard {
            width: 100%;
            height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #0f172a;
            color: white;
            padding: 10px 14px;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .header span {
            background: #3b82f6;
            padding: 3px 10px;
            border-radius: 100px;
            font-size: 0.65rem;
        }

        .two-columns {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            flex-direction: row;
        }

        .form-section {
            flex: 1;
            width: 50%;
            padding: 10px;
            background: #f8fafc;
            overflow-y: auto;
            border-right: 1px solid #e2e8f0;
        }

        .chat-section {
            flex: 1;
            width: 50%;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            min-height: 0;
        }

        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fefefe;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 100%;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 100%;
        }

        .message.system {
            align-items: flex-start;
        }

        .message.user {
            align-items: flex-end;
        }

        .bubble {
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
            max-width: 100%;
        }

        .system .bubble {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            color: #0f172a;
        }

        .user .bubble {
            background: #3b82f6;
            color: white;
        }

        .time {
            font-size: 0.55rem;
            color: #64748b;
            margin-top: 3px;
            margin-inline: 5px;
        }

        .copy-btn {
            background: #e2e8f0;
            border: none;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 0.65rem;
            cursor: pointer;
            margin-top: 4px;
            align-self: flex-end;
            color: #1e293b;
            transition: 0.15s;
        }

        .copy-btn:hover {
            background: #cbd5e1;
        }

        .copy-btn.copied {
            background: #22c55e;
            color: white;
        }

        .form-group {
            margin-bottom: 8px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 3px;
            font-size: 0.7rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.75rem;
            background: white;
        }

        textarea {
            resize: vertical;
            min-height: 40px;
        }

        .row-2, .row-3 {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .row-2 .form-group, .row-3 .form-group {
            flex: 1;
            min-width: 70px;
        }

        button {
            background: #0f172a;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            width: 100%;
            margin-top: 6px;
            cursor: pointer;
        }

        .clear-chat {
            background: #e2e8f0;
            color: #1e293b;
            margin-top: 6px;
        }

        .ogd-group {
            background: #f1f5f9;
            padding: 8px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid #e2e8f0;
        }

        .ogd-group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .remove-ogd-btn {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 0.65rem;
            cursor: pointer;
        }

        .add-ogd-btn {
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 0.7rem;
            cursor: pointer;
            margin-top: 8px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .header {
                padding: 16px 24px;
                font-size: 1.3rem;
            }
            .form-section {
                padding: 20px;
            }
            .bubble {
                font-size: 0.9rem;
                padding: 10px 14px;
            }
            label {
                font-size: 0.8rem;
            }
            input, select, textarea {
                padding: 8px 10px;
                font-size: 0.85rem;
            }
            button {
                padding: 10px 16px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 600px) {
            .header {
                padding: 8px 12px;
                font-size: 0.9rem;
            }
            .form-section, .chat-section {
                padding: 6px;
            }
            .bubble {
                font-size: 0.7rem;
                padding: 5px 8px;
            }
            label {
                font-size: 0.65rem;
            }
            input, select, textarea {
                padding: 4px 6px;
                font-size: 0.7rem;
            }
            button {
                padding: 6px 10px;
                font-size: 0.75rem;
            }
            .row-2, .row-3 {
                gap: 4px;
            }
            .copy-btn {
                padding: 3px 8px;
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="header">
        🍽️ Экспресс-отчёт Директора вагона-ресторана
        <span>Чат</span>
    </div>
    <div class="two-columns">
        <div class="form-section">
            <h3 style="margin:0 0 6px 0;">📋 Данные</h3>
            <div class="row-2">
                <div class="form-group"><label>🚂 Поезд</label><select id="trainNumber"><option>27/28</option><option>67/68</option><option>17/18</option><option>91/92</option><option>195/196</option><option>97/98</option><option>53/54</option><option>141/142</option><option>75/76</option><option>315/316</option><option>7/8</option><option>179/180</option></select></div>
                <div class="form-group"><label>🚃 Состав</label><select id="trainComposition"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div>
            </div>
            <div class="form-group"><label>🗺️ Маршрут</label><select id="routeSelect"><option>Симферополь-Москва</option><option>Москва-Симферополь</option><option>Севастополь-Москва</option><option>Москва-Севастополь</option><option>Санкт-Петербург-Севастополь</option><option>Севастополь-Санкт-Петербург</option><option>Симферополь-Пермь</option><option>Пермь-Симферополь</option><option>Симферополь-Адлер</option><option>Адлер-Симферополь</option><option>Омск-Симферополь</option><option>Симферополь-Омск</option><option>Санкт-Петербург-Москва</option><option>Москва-Санкт-Петербург</option><option>Санкт-Петербург-Евпатория</option><option>Евпатория-Санкт-Петербург</option></select></div>
            <div class="form-group"><label>🚃 №ВР</label><input type="text" id="wagonNumber" placeholder="66018" value="66018"></div>
            <div class="form-group"><label>📅 Дата прибытия</label><input type="date" id="arrivalDate" value="2025-03-20"></div>
            <div class="row-2"><div class="form-group"><label>💰 Выручка</label><input type="number" id="revenue" value="157800"></div><div class="form-group"><label>🧾 Чеков</label><input type="number" id="checkCount" value="34"></div></div>
            <div class="row-2">
                <div class="form-group"><label>👥 ГП (Купе)</label><input type="number" id="gpCoupe" value="42"></div>
                <div class="form-group"><label>👥 СВ</label><input type="number" id="gpSv" value="23"></div>
            </div>
            <div class="row-3"><div class="form-group"><label>🍳 ЛЮКС завтрак</label><input type="number" id="luxBreakfast" value="4"></div><div class="form-group"><label>🍽️ обед</label><input type="number" id="luxLunch" value="5"></div><div class="form-group"><label>🍷 ужин</label><input type="number" id="luxDinner" value="3"></div></div>
            
            <div class="form-group">
                <label>👶 ОГД (группы детей)</label>
                <div id="ogdGroupsContainer">
                    <div class="ogd-group" data-group-index="0">
                        <div class="ogd-group-header">
                            <span>Группа 1</span>
                            <button type="button" class="remove-ogd-btn" onclick="removeOgdGroup(this)">✖ Удалить</button>
                        </div>
                        <div class="row-2">
                            <div class="form-group"><label>👶 Количество детей</label><input type="number" class="ogd-kids" value="4" placeholder="кол-во"></div>
                            <div class="form-group"><label>💰 Выручка (₽)</label><input type="number" class="ogd-revenue" value="2200" placeholder="выручка"></div>
                        </div>
                    </div>
                    <div class="ogd-group" data-group-index="1">
                        <div class="ogd-group-header">
                            <span>Группа 2</span>
                            <button type="button" class="remove-ogd-btn" onclick="removeOgdGroup(this)">✖ Удалить</button>
                        </div>
                        <div class="row-2">
                            <div class="form-group"><label>👶 Количество детей</label><input type="number" class="ogd-kids" value="5" placeholder="кол-во"></div>
                            <div class="form-group"><label>💰 Выручка (₽)</label><input type="number" class="ogd-revenue" value="3500" placeholder="выручка"></div>
                        </div>
                    </div>
                </div>
                <button type="button" class="add-ogd-btn" onclick="addOgdGroup()">+ Добавить группу</button>
            </div>
            
            <div class="form-group"><label>📝 ГП замечания</label><textarea id="gpRemarks" rows="1">Чисто, нареканий нет</textarea></div>
            <div class="form-group"><label>⚠️ Неисправности</label><textarea id="malfunction" rows="1">Датчик двери в 5 вагоне</textarea></div>
            <div class="form-group"><label>🚨 Происшествия</label><textarea id="incidents" rows="1">За время рейса происшествий не зафиксировано</textarea></div>
            <div class="form-group"><label>👤 ДВР</label><input type="text" id="dvr" value="Иванов А.А."></div>
            <button id="sendReportBtn">📤 Отправить</button>
            <button id="clearChatBtn" class="clear-chat">🗑 Очистить чат</button>
        </div>
        <div class="chat-section">
            <div class="chat-messages" id="chatMessages"></div>
        </div>
    </div>
</div>

<script>
    let ogdGroupCounter = 2;

    function addOgdGroup() {
        const container = document.getElementById('ogdGroupsContainer');
        const groupCount = container.children.length;
        const newIndex = groupCount;
        
        const newGroup = document.createElement('div');
        newGroup.className = 'ogd-group';
        newGroup.setAttribute('data-group-index', newIndex);
        newGroup.innerHTML = `
            <div class="ogd-group-header">
                <span>Группа ${newIndex + 1}</span>
                <button type="button" class="remove-ogd-btn" onclick="removeOgdGroup(this)">✖ Удалить</button>
            </div>
            <div class="row-2">
                <div class="form-group"><label>👶 Количество детей</label><input type="number" class="ogd-kids" value="0" placeholder="кол-во"></div>
                <div class="form-group"><label>💰 Выручка (₽)</label><input type="number" class="ogd-revenue" value="0" placeholder="выручка"></div>
            </div>
        `;
        container.appendChild(newGroup);
    }

    function removeOgdGroup(button) {
        const group = button.closest('.ogd-group');
        if (document.querySelectorAll('.ogd-group').length > 1) {
            group.remove();
            const groups = document.querySelectorAll('.ogd-group');
            groups.forEach((g, idx) => {
                const headerSpan = g.querySelector('.ogd-group-header span');
                if (headerSpan) {
                    headerSpan.textContent = `Группа ${idx + 1}`;
                }
                g.setAttribute('data-group-index', idx);
            });
        } else {
            alert('Должна быть хотя бы одна группа');
        }
    }

    function getOgdGroupsData() {
        const groups = [];
        const groupElements = document.querySelectorAll('.ogd-group');
        groupElements.forEach((group, idx) => {
            const kids = parseInt(group.querySelector('.ogd-kids').value) || 0;
            const revenue = parseInt(group.querySelector('.ogd-revenue').value) || 0;
            groups.push({ num: idx + 1, kids: kids, revenue: revenue });
        });
        return groups;
    }

    const trainNumberSelect = document.getElementById('trainNumber');
    const trainCompositionSelect = document.getElementById('trainComposition');
    const routeSelect = document.getElementById('routeSelect');
    const wagonNumberInp = document.getElementById('wagonNumber');
    const arrivalDateInp = document.getElementById('arrivalDate');
    const revenueInp = document.getElementById('revenue');
    const checkCountInp = document.getElementById('checkCount');
    const gpCoupeInp = document.getElementById('gpCoupe');
    const gpSvInp = document.getElementById('gpSv');
    const luxBreakfastInp = document.getElementById('luxBreakfast');
    const luxLunchInp = document.getElementById('luxLunch');
    const luxDinnerInp = document.getElementById('luxDinner');
    const gpRemarksInp = document.getElementById('gpRemarks');
    const malfunctionInp = document.getElementById('malfunction');
    const incidentsInp = document.getElementById('incidents');
    const dvrInp = document.getElementById('dvr');
    const chatContainer = document.getElementById('chatMessages');

    function addInstructionMessage() {
        const wrapper = document.createElement('div');
        wrapper.className = 'message-wrapper';
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message system';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = '1. Заполните форму и нажмите «Отправить».<br>2. Сообщение появится в чате.<br>3. Скопируйте сообщение (кнопка под ним) и направьте в чат Exspress в группу ДВРы Гранд-Питание';
        const timeSpan = document.createElement('div');
        timeSpan.className = 'time';
        timeSpan.textContent = 'только что';
        messageDiv.appendChild(bubble);
        messageDiv.appendChild(timeSpan);
        wrapper.appendChild(messageDiv);
        chatContainer.appendChild(wrapper);
    }

    function addUserMessageWithCopy(text) {
        const wrapper = document.createElement('div');
        wrapper.className = 'message-wrapper';
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message user';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        const timeSpan = document.createElement('div');
        timeSpan.className = 'time';
        const now = new Date();
        timeSpan.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' });
        messageDiv.appendChild(bubble);
        messageDiv.appendChild(timeSpan);
        const copyBtn = document.createElement('button');
        copyBtn.textContent = '📋 Копировать';
        copyBtn.className = 'copy-btn';
        copyBtn.onclick = () => {
            navigator.clipboard.writeText(text).then(() => {
                copyBtn.textContent = '✅ Скопировано!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = '📋 Копировать';
                    copyBtn.classList.remove('copied');
                }, 2000);
            });
        };
        wrapper.appendChild(messageDiv);
        wrapper.appendChild(copyBtn);
        chatContainer.appendChild(wrapper);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function generateReportText() {
        let trainNumber = trainNumberSelect.value;
        let composition = trainCompositionSelect.value;
        let route = routeSelect.value;
        let wagonNumber = wagonNumberInp.value.trim() || "не указан";
        let arrivalDate = arrivalDateInp.value || "дата не задана";
        let revenue = parseFloat(revenueInp.value) || 0;
        let checkCount = parseInt(checkCountInp.value) || 0;
        let gpCoupe = gpCoupeInp.value || "0";
        let gpSv = gpSvInp.value || "0";
        let luxBreakfast = parseInt(luxBreakfastInp.value) || 0;
        let luxLunch = parseInt(luxLunchInp.value) || 0;
        let luxDinner = parseInt(luxDinnerInp.value) || 0;
        let gpRemarks = gpRemarksInp.value.trim() || "—";
        let malfunction = malfunctionInp.value.trim() || "—";
        let incidents = incidentsInp.value.trim() || "—";
        let dvr = dvrInp.value.trim() || "—";
        
        const ogdGroups = getOgdGroupsData();
        
        let ogdText = '';
        for (let i = 0; i < ogdGroups.length; i++) {
            const group = ogdGroups[i];
            ogdText += `   Группа ${group.num}: ${group.kids} детей | ${group.revenue.toLocaleString()} ₽`;
            if (i < ogdGroups.length - 1) ogdText += '\n';
        }

        return `📌 Поезд: ${trainNumber} (${composition} состав)
🗺️ Маршрут: ${route}
🚃 №ВР: ${wagonNumber}
📅 Дата прибытия: ${arrivalDate}
💰 Выручка: ${revenue.toLocaleString()} ₽
🧾 Чеков: ${checkCount.toLocaleString()} шт.
👥 ГП: Купе ${gpCoupe} | СВ ${gpSv}
👑 ЛЮКС:
   🍳 завтрак: ${luxBreakfast}
   🍽️ обед: ${luxLunch}
   🍷 ужин: ${luxDinner}
👶 ОГД (дети):
${ogdText}
📝 ГП замечания:
${gpRemarks}
⚠️ Неисправности:
${malfunction}
🚨 Происшествия:
${incidents}
👤 ДВР: ${dvr}`;
    }

    function sendReportToChat() {
        const reportText = generateReportText();
        if (!reportText) return;
        addUserMessageWithCopy(reportText);
    }

    function clearChat() {
        while (chatContainer.firstChild) {
            chatContainer.removeChild(chatContainer.firstChild);
        }
        addInstructionMessage();
    }

    addInstructionMessage();

    document.getElementById('sendReportBtn').addEventListener('click', sendReportToChat);
    document.getElementById('clearChatBtn').addEventListener('click', clearChat);
</script>
</body>
</html>
